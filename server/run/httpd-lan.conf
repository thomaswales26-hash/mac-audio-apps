# Standalone Apache config — runs as you (no sudo), listens on 8080.
#   /usr/sbin/httpd -f server/run/httpd-lan.conf -k start
#   /usr/sbin/httpd -f server/run/httpd-lan.conf -k stop
PidFile "/Users/thomaswales/.abacusai-bot/session-home/server/run/httpd.pid"
# Unsigned system modules: this build needs the check relaxed

Listen 8080
ServerName 192.168.50.31
ServerRoot "/usr"
# Allow the stock modules (unsigned in this macOS build)


LoadModule mpm_prefork_module libexec/apache2/mod_mpm_prefork.so
LoadModule authz_core_module libexec/apache2/mod_authz_core.so
LoadModule dir_module libexec/apache2/mod_dir.so
LoadModule mime_module libexec/apache2/mod_mime.so
LoadModule headers_module libexec/apache2/mod_headers.so
LoadModule log_config_module libexec/apache2/mod_log_config.so
LoadModule unixd_module libexec/apache2/mod_unixd.so
LoadModule alias_module libexec/apache2/mod_alias.so


ErrorLog "/Users/thomaswales/.abacusai-bot/session-home/server/run/error.log"
CustomLog "/Users/thomaswales/.abacusai-bot/session-home/server/run/access.log" common

TypesConfig /private/etc/apache2/mime.types

DocumentRoot "/Users/thomaswales/.abacusai-bot/session-home/site"

<Directory "/Users/thomaswales/.abacusai-bot/session-home/site">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    AddType application/x-apple-diskimage .dmg
    <FilesMatch "\.(png|ico)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    <FilesMatch "\.dmg$">
        Header set Content-Disposition "attachment"
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</Directory>
