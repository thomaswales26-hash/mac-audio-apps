# Soundcard Recorder / Dance Box Radio showcase site
# Served by macOS's built-in Apache.
#
# Install:
#   sudo cp server/httpd-site.conf /etc/apache2/other/soundcard-site.conf
#   sudo apachectl start
#
# Then: http://localhost  or  http://<your-LAN-IP>
# This config does not modify the stock httpd.conf; the main config includes
# everything in /etc/apache2/other/*.conf.

Listen 80

DocumentRoot "/Users/thomaswales/.abacusai-bot/session-home"

<Directory "/Users/thomaswales/.abacusai-bot/session-home">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted

    # Serve index.html for the directory
    DirectoryIndex index.html

    # Caching: icons and page for an hour, the DMGs for a day
    <FilesMatch "\.(png|jpg|svg|ico)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    # DMGs: force a download with the right type
    AddType application/x-apple-diskimage .dmg
    <FilesMatch "\.dmg$">
        Header set Content-Disposition "attachment"
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # Don't let the server hand out dotfiles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

# Keep it quiet and small; drop to 1.1 so caching headers behave
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers        2
    MinSpareServers     2
    MaxSpareServers     5
    MaxRequestWorkers   40
</IfModule>
