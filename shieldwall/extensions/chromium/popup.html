<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shieldwall</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><img src="icons/icon-48.png" alt=""><div><h1>Shieldwall</h1><p>Popup & ad protection</p></div></header>
<section class="status"><div><strong id="stateLabel">Protection on</strong><span id="siteLabel">Checking this site…</span></div><label class="switch"><input id="enabled" type="checkbox"><span></span></label></section>
<button id="siteToggle" class="site" disabled>Allow on this site</button>
<section class="count"><b id="count">0</b><span>interruptions blocked</span></section>
<p class="privacy">Runs locally. No browsing history, analytics, or personal data leaves your browser.</p></main><script src="popup.js"></script></body></html>
