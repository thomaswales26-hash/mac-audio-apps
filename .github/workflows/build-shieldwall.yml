name: Build Shieldwall macOS installers

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "shieldwall-v*"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    defaults:
      run:
        working-directory: shieldwall

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shieldwall/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate JavaScript
        run: pnpm check

      - name: Build DMG and PKG
        run: pnpm package:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Shieldwall-macOS-${{ matrix.arch }}
          path: |
            shieldwall/release/*.dmg
            shieldwall/release/*.pkg
          if-no-files-found: error

  release:
    name: Publish Shieldwall release
    if: startsWith(github.ref, 'refs/tags/shieldwall-v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: Shieldwall-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Shieldwall 1.0.0
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.pkg
